<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tarea - Lista de tareas</title>
<style>
body { font-family: Arial, sans-serif; max-width: 640px; margin: 30px auto; }
section { border: 1px solid #ccc; padding: 12px; margin-bottom: 16px; }
.error { color: #c0392b; }
.hecha { text-decoration: line-through; color: #888; }
li { margin: 6px 0; }
button { margin-left: 6px; }
</style>
</head>
<body>
<h1>Mi lista de tareas</h1>
<section>
  <form id="formTarea">
    <input id="texto" type="text" placeholder="Nueva tarea">
    <select id="prioridad">
      <option value="Alta">Alta</option>
      <option value="Media" selected>Media</option>
      <option value="Baja">Baja</option>
    </select>
    <button type="submit">Agregar</button>
  </form>
  <small id="contadorLetras">0 caracteres</small>
  <p id="mensaje"></p>
</section>
<section>
  <input id="buscador" type="text" placeholder="Buscar tarea...">
  <ul id="lista"></ul>
  <p id="resumen"></p>
</section>
<script src="app.js"></script>
</body>
</html>
